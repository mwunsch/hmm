name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list jq >/dev/null 2>&1 || brew install jq

      - name: Run tests
        run: tests/run
